apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deployment
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # minio/minio is no longer published on Docker Hub or quay.io.
          # bitnamilegacy images are frozen (Aug 2025) but still pullable.
          image: bitnamilegacy/minio:2025.7.23-debian-12-r5
          # Root, like the former official image, so /data on the PVC is writable.
          securityContext:
            runAsUser: 0
          args:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: "minio_user"
            - name: MINIO_ROOT_PASSWORD
              value: "minio_password"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-mlflow-bucket
  namespace: minio
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
          securityContext:
            runAsUser: 0
          env:
            - name: MINIO_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: MINIO_ROOT_USER
              value: minio_user
            - name: MINIO_ROOT_PASSWORD
              value: minio_password
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # MinIO may still be pulling or starting: wait up to 5 minutes.
              i=0
              until mc alias set local "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                i=$((i + 1))
                [ "$i" -ge 100 ] && echo "MinIO not reachable after 5 minutes" && exit 1
                sleep 3
              done
              mc mb --ignore-existing local/bucket
              mc ls local
